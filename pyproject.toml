[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepick-l0"
version = "0.1.0"
description = "CodePick L0 content data foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "arq>=0.26",
  "boto3>=1.34",
  "cssselect>=1.2",
  "feedparser>=6.0",
  "httpx>=0.26",
  "lxml>=5.0",
  "playwright>=1.44",
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-dateutil>=2.8",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
core-data = "core_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"core_data.scripts" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast tests without external services",
  "integration: tests that need external services",
]
addopts = "--cov=core_data --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "src/core_data/cli.py",
  "src/core_data/config.py",
  "src/core_data/db/session.py",
  "src/core_data/scripts/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["core_data"]

[[tool.mypy.overrides]]
module = ["boto3", "feedparser"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "core_data"

[[tool.importlinter.contracts]]
name = "core_data must not import upper layers"
type = "forbidden"
source_modules = ["core_data"]
forbidden_modules = ["app_l1", "app_l2", "app_l3", "l1", "l2", "l3"]
